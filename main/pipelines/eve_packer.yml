---
parameters:
  - name: azureEnvironment
    displayName: Azure DevOps deployment environment
    type: string
    default: dev
  - name: ubuntuImageVersion
    displayName: Exact Ubuntu 22.04 Gen2 Marketplace version
    type: string
    default: "SET_EXACT_VERSION"
  - name: eveImageVersion
    displayName: New EVE gallery image version
    type: string
    default: "0.1.0"

variables:
  - group: dostest01kv01
  - name: PACKER_VERSION
    value: "1.14.3"
  - name: PACKER_ROOT
    value: main/packer/eve

trigger: none

stages:
  - stage: Build
    displayName: Build and publish EVE image
    jobs:
      - deployment: Packer
        displayName: Build and publish EVE image
        environment: ${{ parameters.azureEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - task: riezebosch.Packer.PackerTool.PackerTool@0
                  displayName: Use Packer $(PACKER_VERSION)
                  inputs:
                    version: $(PACKER_VERSION)
                - task: CmdLine@2
                  displayName: Packer version
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer version
                - task: CmdLine@2
                  displayName: Packer init
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer init ./
                - task: CmdLine@2
                  displayName: Packer format and validate
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: |
                      set -euo pipefail
                      if [ '${{ parameters.ubuntuImageVersion }}' = 'SET_EXACT_VERSION' ]; then
                        echo 'Select an exact Ubuntu Marketplace version when starting the pipeline.'
                        exit 1
                      fi
                      packer fmt -check ./
                      packer validate ./
                  env:
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: ${{ parameters.ubuntuImageVersion }}
                    PKR_VAR_eve_image_version: ${{ parameters.eveImageVersion }}
                - task: CmdLine@2
                  displayName: Packer build
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer build -on-error=cleanup ./
                  env:
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: ${{ parameters.ubuntuImageVersion }}
                    PKR_VAR_eve_image_version: ${{ parameters.eveImageVersion }}
