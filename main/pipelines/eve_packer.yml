---
variables:
  # variable group name in DevOps
  - group: dostest01kv01
  # Directory to run tasks
  - name: parentpath
    value: main
  - name: dir
    value: packer/eve
  # spn
  - name: spn
    value: "Azure SPN devops-spn"
  - name: PACKER_VERSION
    value: "1.14.3"
###
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - main/packer/eve/**
stages:
  - stage: Build
    jobs:
      - job: Packer
        displayName:
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1
          - task: riezebosch.Packer.PackerTool.PackerTool@0
            displayName: Use Packer $(PACKER_VERSION)
            inputs:
              version: $(PACKER_VERSION)
          - task: CmdLine@2
            displayName: Packer version
            inputs:
              workingDirectory: $(parentpath)/$(dir)
              script: packer version
          - task: CmdLine@2
            displayName: Packer init
            inputs:
              workingDirectory: $(parentpath)/$(dir)
              script: packer init ./
          - task: CmdLine@2
            displayName: Packer format and validate
            inputs:
              workingDirectory: $(parentpath)/$(dir)
              script: |
                set -euo pipefail
                packer fmt -check ./
                packer validate ./
            env:
              PKR_VAR_spn-client-id: $(dostest-spn-id)
              PKR_VAR_spn-client-secret: $(dostest-spn-secret)
              PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
              PKR_VAR_ubuntu_image_version: $(ubuntu-image-version)
          - task: CmdLine@2
            displayName: Packer build
            inputs:
              workingDirectory: $(parentpath)/$(dir)
              script: packer build -on-error=cleanup ./
            env:
              PKR_VAR_spn-client-id: $(dostest-spn-id)
              PKR_VAR_spn-client-secret: $(dostest-spn-secret)
              PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
              PKR_VAR_ubuntu_image_version: $(ubuntu-image-version)
