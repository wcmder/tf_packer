---
variables:
  - group: dostest01kv01
  # Set to "false" to skip all work on automatic and manual runs.
  # To disable automatic runs entirely, replace the trigger block below with: trigger: none
  - name: IPERF_PIPELINE_ENABLED
    value: "true"
  - name: AZURE_ENVIRONMENT
    value: dev_packer
  # Destination gallery created by main/env/dev/use/images.
  # AZURE_ENVIRONMENT above selects the Azure DevOps deployment environment only.
  - name: IMAGE_SUBSCRIPTION_ID
    value: "a4b57fa5-2f2c-4732-b452-32be7d1724b1"
  - name: IMAGE_RESOURCE_GROUP
    value: "dev-use-images-rg"
  - name: IMAGE_GALLERY
    value: "image_gallery"
  - name: IMAGE_LOCATION
    value: "East US"
  - name: UBUNTU_IMAGE_VERSION
    value: "22.04.202608060"
  - name: IPERF_IMAGE_VERSION
    value: "0.1.$(Build.BuildId)"
  - name: PACKER_VERSION
    value: "1.14.3"
  - name: PACKER_ROOT
    value: main/packer/iperf

trigger:
  branches:
    include: [main]
  paths:
    include:
      - main/packer/iperf/**
      - main/pipelines/iperf_packer.yml

stages:
  - stage: Build
    displayName: Build and publish iPerf image
    condition: and(succeeded(), eq(variables['IPERF_PIPELINE_ENABLED'], 'true'))
    jobs:
      - deployment: Packer
        displayName: Build and publish iPerf image
        environment: ${{ variables.AZURE_ENVIRONMENT }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - task: riezebosch.Packer.PackerTool.PackerTool@0
                  displayName: Use Packer $(PACKER_VERSION)
                  inputs:
                    version: $(PACKER_VERSION)
                - task: CmdLine@2
                  displayName: Packer version
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer version
                - task: CmdLine@2
                  displayName: Packer init
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer init ./
                - task: CmdLine@2
                  displayName: Packer format and validate
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: |
                      set -euo pipefail
                      if [[ ! '$(UBUNTU_IMAGE_VERSION)' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo 'UBUNTU_IMAGE_VERSION must be an exact numeric Marketplace version, such as 22.04.202608060.'
                        exit 1
                      fi
                      packer fmt -check ./
                      packer validate ./
                  env:
                    PKR_VAR_subscription_id: $(IMAGE_SUBSCRIPTION_ID)
                    PKR_VAR_image_resource_group: $(IMAGE_RESOURCE_GROUP)
                    PKR_VAR_gallery_name: $(IMAGE_GALLERY)
                    PKR_VAR_location: $(IMAGE_LOCATION)
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: $(UBUNTU_IMAGE_VERSION)
                    PKR_VAR_iperf_image_version: $(IPERF_IMAGE_VERSION)
                - task: CmdLine@2
                  displayName: Packer build
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer build -on-error=cleanup ./
                  env:
                    PKR_VAR_subscription_id: $(IMAGE_SUBSCRIPTION_ID)
                    PKR_VAR_image_resource_group: $(IMAGE_RESOURCE_GROUP)
                    PKR_VAR_gallery_name: $(IMAGE_GALLERY)
                    PKR_VAR_location: $(IMAGE_LOCATION)
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: $(UBUNTU_IMAGE_VERSION)
                    PKR_VAR_iperf_image_version: $(IPERF_IMAGE_VERSION)
