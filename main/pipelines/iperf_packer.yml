---
parameters:
  - name: azureEnvironment
    displayName: Azure DevOps deployment environment
    type: string
    default: dev_packer
  - name: ubuntuImageVersion
    displayName: Exact Ubuntu 22.04 Gen2 Marketplace version
    type: string
    default: "22.04.202608060"
  - name: iperfImageVersion
    displayName: New iPerf gallery image version
    type: string
    default: "0.1.0"

variables:
  - group: dostest01kv01
  - name: PACKER_VERSION
    value: "1.14.3"
  - name: PACKER_ROOT
    value: main/packer/iperf

trigger: none

stages:
  - stage: Build
    displayName: Build and publish iPerf image
    jobs:
      - deployment: Packer
        displayName: Build and publish iPerf image
        environment: ${{ parameters.azureEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - task: riezebosch.Packer.PackerTool.PackerTool@0
                  displayName: Use Packer $(PACKER_VERSION)
                  inputs:
                    version: $(PACKER_VERSION)
                - task: CmdLine@2
                  displayName: Packer version
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer version
                - task: CmdLine@2
                  displayName: Packer init
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer init ./
                - task: CmdLine@2
                  displayName: Packer format and validate
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: |
                      set -euo pipefail
                      if [[ ! '${{ parameters.ubuntuImageVersion }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo 'ubuntuImageVersion must be an exact numeric Marketplace version, such as 22.04.202608060.'
                        exit 1
                      fi
                      packer fmt -check ./
                      packer validate ./
                  env:
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: ${{ parameters.ubuntuImageVersion }}
                    PKR_VAR_iperf_image_version: ${{ parameters.iperfImageVersion }}
                - task: CmdLine@2
                  displayName: Packer build
                  inputs:
                    workingDirectory: $(PACKER_ROOT)
                    script: packer build -on-error=cleanup ./
                  env:
                    PKR_VAR_spn-client-id: $(dostest-spn-id)
                    PKR_VAR_spn-client-secret: $(dostest-spn-secret)
                    PKR_VAR_spn-tenant-id: $(dostest-tenant-id)
                    PKR_VAR_ubuntu_image_version: ${{ parameters.ubuntuImageVersion }}
                    PKR_VAR_iperf_image_version: ${{ parameters.iperfImageVersion }}
