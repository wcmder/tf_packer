---
parameters:
  - name: azureEnvironment
    displayName: Azure DevOps deployment environment
    type: string
    default: dev_packer
  - name: iperfImageVersion
    displayName: Existing iPerf gallery image version to deploy
    type: string
    default: "0.1.737"

variables:
  - group: dostest01kv01
  # Set to "false" to skip plan and apply on automatic and manual runs.
  # To disable automatic runs entirely, replace the trigger block below with: trigger: none
  - name: IPERF_PIPELINE_ENABLED
    value: "true"
  - name: TF_VERSION
    value: "1.14.6"
  - name: TF_ROOT
    value: main/env/dev/use/iperf
  - name: REPO_USERNAME
    value: wder

trigger:
  branches:
    include: [main]
  paths:
    include:
      - main/env/dev/use/iperf/**
      - main/stacks/iperf/**
      - main/stacks/context/**
      - main/pipelines/iperf_dev.yml
      - main/env/dev/use/iperf2/**

stages:
  - stage: Build
    displayName: Plan iPerf
    condition: and(succeeded(), eq(variables['IPERF_PIPELINE_ENABLED'], 'true'))
    jobs:
      - job: terraform_plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)
          - task: Bash@3
            displayName: Terraform init
            inputs:
              targetType: inline
              workingDirectory: $(TF_ROOT)
              script: |
                set -euo pipefail
                basic_auth="$(printf '%s:%s' "$REPO_USERNAME" "$REPO_ACCESS" | base64 | tr -d '\n')"
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
                GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $basic_auth" \
                terraform init -upgrade -reconfigure -backend-config="access_key=$BACKEND_ACCESS_KEY"
            env:
              REPO_ACCESS: $(repo-access)
              REPO_USERNAME: $(REPO_USERNAME)
              BACKEND_ACCESS_KEY: $(dostest01sa01-key1)
          - task: Bash@3
            name: detect_changes
            displayName: Terraform validate and plan
            inputs:
              targetType: inline
              workingDirectory: $(TF_ROOT)
              script: |
                set -euo pipefail
                terraform validate
                set +e
                terraform plan -input=false -detailed-exitcode -out=tfplan
                plan_exit_code=$?
                set -e
                case "$plan_exit_code" in
                  0) echo "##vso[task.setvariable variable=changesPresent;isOutput=true]false" ;;
                  2) echo "##vso[task.setvariable variable=changesPresent;isOutput=true]true" ;;
                  *) exit "$plan_exit_code" ;;
                esac
            env:
              TF_VAR_spn-client-id: $(dostest-spn-id)
              TF_VAR_spn-client-secret: $(dostest-spn-secret)
              TF_VAR_spn-tenant-id: $(dostest-tenant-id)
              TF_VAR_iperf_image_version: ${{ parameters.iperfImageVersion }}
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: main
              archiveType: tar
              tarCompression: gz
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-iperf-tfplan.tgz
              replaceExistingArchive: true
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-iperf-tfplan.tgz
              artifact: $(Build.BuildId)-iperf-tfplan

  - stage: Deploy
    displayName: Apply iPerf
    dependsOn: Build
    condition: and(succeeded(), eq(variables['IPERF_PIPELINE_ENABLED'], 'true'), eq(dependencies.Build.outputs['terraform_plan.detect_changes.changesPresent'], 'true'))
    jobs:
      - deployment: terraform_apply
        environment: ${{ parameters.azureEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: $(Build.BuildId)-iperf-tfplan
                    path: $(System.ArtifactsDirectory)
                - task: ExtractFiles@1
                  inputs:
                    archiveFilePatterns: $(System.ArtifactsDirectory)/**/$(Build.BuildId)-iperf-tfplan.tgz
                    destinationFolder: $(System.DefaultWorkingDirectory)
                    cleanDestinationFolder: false
                    overwriteExistingFiles: true
                - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TF_VERSION)
                - task: Bash@3
                  displayName: Terraform init
                  inputs:
                    targetType: inline
                    workingDirectory: $(System.DefaultWorkingDirectory)/$(TF_ROOT)
                    script: |
                      set -euo pipefail
                      basic_auth="$(printf '%s:%s' "$REPO_USERNAME" "$REPO_ACCESS" | base64 | tr -d '\n')"
                      GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
                      GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $basic_auth" \
                      terraform init -upgrade -reconfigure -backend-config="access_key=$BACKEND_ACCESS_KEY"
                  env:
                    REPO_ACCESS: $(repo-access)
                    REPO_USERNAME: $(REPO_USERNAME)
                    BACKEND_ACCESS_KEY: $(dostest01sa01-key1)
                - task: Bash@3
                  displayName: Terraform apply
                  inputs:
                    targetType: inline
                    workingDirectory: $(System.DefaultWorkingDirectory)/$(TF_ROOT)
                    script: terraform apply -auto-approve -input=false tfplan
                  env:
                    TF_VAR_spn-client-id: $(dostest-spn-id)
                    TF_VAR_spn-client-secret: $(dostest-spn-secret)
                    TF_VAR_spn-tenant-id: $(dostest-tenant-id)
                    TF_VAR_iperf_image_version: ${{ parameters.iperfImageVersion }}
