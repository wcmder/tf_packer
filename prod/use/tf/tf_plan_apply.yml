---
variables:
# variable group name in DevOps
- group: dostest01kv01
# Directory to run tasks
- name: parentpath
  value: tf_packer
- name : dir
  value: prod/use/tf
# Terraform version
- name : tfversion
  value: '1.7.2'
# environment name in DevOps
- name : env
  value: tf_packer
###
trigger:
  branches:
    include:
    - main
  paths:
    include: 
    - tf_packer/prod/use/tf
    exclude:
    - tf_packer/prod/use/tf/*.yml
stages:
  - stage: Build
    jobs:
    - job: tf_plan
      displayName: TF Plan
      pool:
        vmImage: ubuntu-latest
      steps:
      - checkout: self
      - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
        displayName: Install Terraform $(tfversion)
        inputs:
          terraformVersion: $(tfversion)
      - task: CmdLine@2
        displayName: Terraform Init
        inputs:
          script: terraform init -upgrade -reconfigure -backend-config="access_key=$(dostest01sa01-key1)"
          workingDirectory: $(parentpath)/$(dir)
      - task: CmdLine@2
        displayName: Terraform Validate
        inputs:
          script: terraform validate
          workingDirectory: $(parentpath)/$(dir)
      - task: CmdLine@2
        displayName: Terraform Plan
        inputs:
          script: terraform plan -input=false -out=tfplan -var="spn-client-id=$(dostest-spn-id)" -var="spn-client-secret=$(dostest-spn-secret)" -var="spn-tenant-id=$(dostest-tenant-id)"
          workingDirectory: $(parentpath)/$(dir)
      - task: ArchiveFiles@2
        displayName: Archive Artifacts
        inputs:
          rootFolderOrFile: $(parentpath)
          archiveType: tar
          tarCompression: gz
          sevenZipCompression: 5
          replaceExistingArchive: true
          archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-tfplan.tgz
          overwrite: true
      - task: PublishPipelineArtifact@1
        displayName: Publish Terraform Artifact
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-tfplan.tgz
          ArtifactName: $(Build.BuildId)-tfplan
  - stage: Deploy
    jobs:
      - deployment:
        displayName: TF Apply
        pool:
          vmImage: ubuntu-latest
        environment: $(env)
        strategy:
         runOnce:
          deploy:
           steps:
           - checkout: self
           #- task: ManualValidation@0
           #  timeoutInMinutes: 1440 # task times out in 1 day
           #  inputs:
           #   instructions: Please validate the build
           #   onTimeout: reject
           - task: DownloadPipelineArtifact@2
             inputs:
               artifactName: $(Build.BuildId)-tfplan
               path: $(System.ArtifactsDirectory)
           - task: ExtractFiles@1
             inputs:
              archiveFilePatterns: $(System.ArtifactsDirectory)/**/$(Build.BuildId)-tfplan.tgz
              destinationFolder: $(System.DefaultWorkingDirectory)
              cleanDestinationFolder: false
              overwriteExistingFiles: true
           - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
             displayName: Install Terraform $(tfversion)
             inputs:
                terraformVersion: $(tfversion)
           - task: CmdLine@2
             displayName: Terraform Init
             inputs:
                script: terraform init -upgrade -backend-config="access_key=$(dostest01sa01-key1)"
                workingDirectory: $(System.DefaultWorkingDirectory)/$(parentpath)/$(dir)
           - task: CmdLine@2
             displayName: Terraform Apply
             inputs:
                script: terraform apply -auto-approve -input=false tfplan
                workingDirectory: $(System.DefaultWorkingDirectory)/$(parentpath)/$(dir)
...